<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05060c">
<title>Shadow Legacy — V8</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03040a;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit;color:#fff;border:1px solid #665b78;background:linear-gradient(#272437,#11131e);border-radius:14px;padding:12px 16px;font-weight:800;box-shadow:0 7px 20px #0008;cursor:pointer}button:active{transform:scale(.97)}button:focus{outline:none}button:focus-visible{outline:2px solid #e7c76c;outline-offset:2px}button:disabled{opacity:.4;filter:grayscale(.7)}.gold{border-color:#d8b55f;background:linear-gradient(#624a21,#2b2112)}.purple{border-color:#9c7ac5}.green{border-color:#5da77d}.red{border-color:#a45d68}.screen{position:absolute;inset:0;display:none;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));overflow:auto}.screen.active{display:flex;flex-direction:column}.panel{width:min(980px,96vw);margin:auto;background:#080b13ed;border:1px solid #8d779666;border-radius:22px;padding:18px;box-shadow:0 25px 100px #000b;backdrop-filter:blur(9px)}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.card{background:#111522;border:1px solid #343b50;border-radius:17px;padding:14px}.card.selected{border-color:#e7c76c;box-shadow:0 0 0 2px #e7c76c33,0 0 25px #e7c76c18}.muted{opacity:.68}.tiny{font-size:12px;opacity:.65}.big{font-size:30px}.price{color:#f0cf70;font-weight:900}.spacer{flex:1}
#loading{align-items:center;justify-content:center;text-align:center;background:#03040a}.loadLogo{font-size:clamp(46px,13vw,80px);font-weight:1000;letter-spacing:9px;animation:pulse 1.5s infinite}.loadSub{letter-spacing:5px;opacity:.7}.loader{width:min(430px,82vw);height:9px;background:#171a25;border-radius:20px;overflow:hidden;margin:22px 0 8px}.loader i{display:block;width:0;height:100%;background:linear-gradient(90deg,#7657a8,#e5c765);animation:load 2.3s forwards}@keyframes load{to{width:100%}}@keyframes pulse{50%{transform:scale(1.04);opacity:.72}}
#menu{justify-content:flex-end;align-items:center;text-align:center;overflow:hidden}#menuBg{position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 50% 28%,#302747,#111525 38%,#03040a 76%);overflow:hidden}#menuBg:before,#menuBg:after{content:"";position:absolute;width:150%;height:150%;left:-25%;top:-25%;background:conic-gradient(from 0deg,transparent,#8d68bc18,transparent,#d6b75b12,transparent);animation:spin 18s linear infinite}#menuBg:after{animation-duration:30s;animation-direction:reverse;transform:scale(1.3)}@keyframes spin{to{transform:rotate(360deg)}}.logo{font-size:clamp(42px,11vw,82px);line-height:.9;letter-spacing:8px;font-weight:1000;text-shadow:0 0 28px #b899ef66,0 5px #17121d}.sub{letter-spacing:4px;opacity:.7;margin:8px 0 18px}.menuBtns{width:min(400px,92vw);display:grid;gap:9px}.menuBtns button{font-size:17px;padding:15px}.menuStats{margin:10px 0 10px;background:#070a11bb;border:1px solid #77708a44;border-radius:13px;padding:8px 12px;font-size:13px}
#story{justify-content:center;align-items:center;text-align:center;background:#02030ae8}.storyArt{font-size:72px;animation:float 2s infinite}.storyTitle{font-size:35px;font-weight:1000}.storyText{max-width:720px;line-height:1.6;font-size:17px}@keyframes float{50%{transform:translateY(-9px)}}
#select{justify-content:center;align-items:center}.char{min-height:210px;text-align:left}.charArt{height:95px;display:grid;place-items:center;font-size:70px;filter:drop-shadow(0 10px 12px #000)}.stats{font-size:13px;line-height:1.65}.tag{display:inline-block;padding:3px 7px;border-radius:99px;background:#292236;border:1px solid #67527d;font-size:11px;margin:2px}
#gameplay{padding:0;overflow:hidden;overscroll-behavior:none;touch-action:none}#arena{position:absolute;inset:0;overflow:hidden;background:radial-gradient(circle at 50% 35%,#28334b 0,#11192a 32%,#050810 72%,#020309 100%)}#arena:before,#arena:after{content:"";position:absolute;inset:-25%;background:conic-gradient(from 0deg,transparent,#c18efb0e,transparent,#e4c46d0a,transparent);animation:spin 16s linear infinite}#arena:after{animation-duration:27s;animation-direction:reverse}.ground{position:absolute;left:-10%;right:-10%;bottom:17%;height:22%;background:radial-gradient(ellipse,#27314866,transparent 68%);border-bottom:1px solid #7d6b8044}.mist{position:absolute;left:-20%;right:-20%;bottom:0;height:42%;background:linear-gradient(transparent,#02030af2);pointer-events:none}.particle{position:absolute;width:4px;height:4px;border-radius:50%;background:#e4c46d77;animation:rise linear infinite;bottom:-10px}@keyframes rise{to{transform:translateY(-110vh);opacity:0}}
#hud{position:fixed;z-index:10;top:max(8px,env(safe-area-inset-top));left:9px;right:9px;display:flex;justify-content:space-between;gap:7px;pointer-events:none}.hudBox{background:#060911d9;border:1px solid #70698366;border-radius:13px;padding:7px 9px;backdrop-filter:blur(6px)}.bar{height:10px;width:min(170px,35vw);background:#1b2130;border-radius:10px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#d54c5a,#ffab66);transition:width .2s}.enemyBar i{background:linear-gradient(90deg,#aa3f70,#e6b157)}
#fighters{position:absolute;z-index:4;inset:20% 0 25%}.fighter{position:absolute;bottom:5%;width:170px;text-align:center}.heroPos{left:6%}.enemyPos{right:6%}.sprite{font-size:84px;filter:drop-shadow(0 15px 10px #000b);animation:bob 1.5s ease-in-out infinite;display:inline-block}.enemy .sprite{animation-duration:.85s}.hit .sprite{animation:hit .25s}.dead .sprite{animation:fadeOut .55s forwards}@keyframes bob{50%{transform:translateY(-8px)}}@keyframes hit{50%{transform:translateX(-13px) rotate(-5deg)}}@keyframes fadeOut{to{opacity:.15;transform:translateY(28px) scale(.82)}}.name{font-weight:900;text-shadow:0 2px 5px #000}.damage{position:absolute;left:50%;top:25%;font-size:28px;font-weight:1000;opacity:0;pointer-events:none}.damage.pop{animation:dmg .7s forwards}@keyframes dmg{10%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-55px)}}.slash{position:absolute;left:50%;top:37%;font-size:55px;opacity:0}.slash.show{animation:slash .35s forwards}@keyframes slash{15%{opacity:1;transform:translate(-50%) scale(.7) rotate(-15deg)}100%{opacity:0;transform:translate(-50%) scale(1.4) rotate(25deg)}}
#chapterTag{position:fixed;z-index:8;top:17%;left:50%;transform:translateX(-50%);background:#05070dcc;border:1px solid #9d876a88;border-radius:99px;padding:7px 13px;font-weight:900;white-space:nowrap}.enemyTitle{font-size:13px;opacity:.78}.bossTitle{color:#f0c967}.chest{position:fixed;z-index:6;left:50%;bottom:27%;transform:translateX(-50%);font-size:48px;display:none;animation:chest 1s infinite}.chest.show{display:block}@keyframes chest{50%{transform:translateX(-50%) translateY(-8px)}}
#controls{position:fixed;z-index:12;left:0;right:0;bottom:max(9px,env(safe-area-inset-bottom));padding:8px 10px;display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.ctrl{min-height:58px;font-size:12px;padding:7px}.ctrl.attack{border-color:#d3a95c}.ctrl.p1{border-color:#9a79c2}.ctrl.p7{border-color:#b18be3}.ctrl.p9{border-color:#df7d57}.ctrl.p11{border-color:#e7c766}.ctrl.heal{border-color:#63a980}.cool{font-size:11px;opacity:.7;display:block;margin-top:2px}
#cutscene{position:fixed;z-index:30;inset:0;background:radial-gradient(circle,#161a2c,#020309 72%);display:none;align-items:center;justify-content:center;text-align:center;padding:22px}.cs{max-width:760px}.csIcon{font-size:82px;animation:float 1.5s infinite}.cs h2{font-size:39px;margin:8px}.cs p{font-size:17px;line-height:1.6;opacity:.9}.cinBar{height:4px;background:#272b38;border-radius:5px;overflow:hidden}.cinBar i{display:block;height:100%;width:0;background:#d9bb64}
#toast{position:fixed;z-index:50;left:50%;top:15%;transform:translateX(-50%);background:#080b13f4;border:1px solid #b49c6d99;border-radius:14px;padding:11px 15px;opacity:0;transition:.2s;pointer-events:none;text-align:center}.show{opacity:1!important}
#cutscene.show{display:flex}.modal{position:absolute;z-index:40;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}.modalPanel{width:min(700px,95vw);max-height:88vh;overflow:hidden;background:#090d16;border:1px solid #756782;border-radius:20px;padding:18px;display:flex;flex-direction:column}.modalPanel #modalBody{overflow:auto;overscroll-behavior:contain;padding-right:2px}.shopCoins{position:sticky;top:0;z-index:3;background:#090d16;border-bottom:1px solid #292e3a;padding:0 0 10px;margin-bottom:2px}.shopItem{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid #292e3a;padding:13px 0}.shopItem:last-child{border-bottom:0}.skinGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.skin{display:flex;flex-direction:column;align-items:stretch;gap:8px;min-width:0}.skinIcon{font-size:38px;text-align:center;height:50px;display:grid;place-items:center}.skinInfo{text-align:center;min-width:0}.skin button{width:100%;margin-top:2px}.skin.locked{opacity:.72}.skin.active{border-color:#e4c46d}.specialPower{display:flex;align-items:center;justify-content:space-between;gap:10px}.specialPower .spInfo{min-width:0}.specialPower button{flex:0 0 auto}.notice{padding:10px;border:1px solid #554c62;background:#111420;border-radius:12px;margin:8px 0}.result{align-items:center;justify-content:center;text-align:center;background:#03050af5}.resultTitle{font-size:55px;font-weight:1000}.victory{color:#e7c56b}.defeat{color:#dc6873}.resultIcon{font-size:85px}.scoreline{font-size:18px;margin:8px}.miniTable{width:100%;border-collapse:collapse}.miniTable td,.miniTable th{padding:9px;border-bottom:1px solid #292e3a;text-align:left}.onlineBadge{font-size:11px;border:1px solid #4f966c;padding:3px 6px;border-radius:99px;color:#8be2aa}.offlineBadge{font-size:11px;border:1px solid #866d4f;padding:3px 6px;border-radius:99px;color:#e7c56b}
@media(max-width:520px){.skinGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.modalPanel{padding:14px}.shopItem{gap:8px}.specialPower{align-items:flex-start}.specialPower button{padding:10px 11px}}@media(min-width:700px){#controls{width:760px;left:50%;right:auto;transform:translateX(-50%)}.heroPos{left:18%}.enemyPos{right:18%}}
</style>
</head>
<body>
<div id="app">
<section id="loading" class="screen active"><div class="loadLogo">SHADOW</div><div class="loadSub">LEGACY</div><div class="loader"><i></i></div><div class="tiny">Chargement de l'ombre…</div></section>
<section id="menu" class="screen"><div id="menuBg"></div><div class="spacer"></div><div class="logo">SHADOW<br>LEGACY</div><div class="sub">LE DESTIN SE RÉVEILLE</div><div class="menuStats" id="menuStats"></div><div class="menuBtns"><button class="gold" onclick="startGame()">▶ JOUER</button><button onclick="openShop()">🛒 BOUTIQUE</button><button onclick="openScores()">🏆 CLASSEMENT</button><button onclick="openSettings()">⚙ RÉGLAGES</button><button onclick="openSocial()">👥 AMIS & DUEL</button></div><div class="tiny">V8 • sauvegarde automatique</div></section>
<section id="story" class="screen"><div class="panel"><div class="storyArt" id="storyArt">🌑</div><div class="storyTitle" id="storyTitle"></div><p class="storyText" id="storyText"></p><div class="row" style="justify-content:center"><button class="gold" onclick="nextStory()">CONTINUER</button></div></div></section>
<section id="select" class="screen"><div class="panel"><h2>Choisis ton personnage</h2><p class="muted">Chaque héros a ses propres PV, dégâts et style. Le niveau de pouvoir 1 → 11 améliore ses statistiques.</p><div id="chars" class="grid"></div><div class="row" style="margin-top:12px"><button class="gold" onclick="confirmCharacter()">▶ COMMENCER</button><button onclick="show('menu')">Retour</button></div></div></section>
<section id="gameplay" class="screen"><div id="arena"><div class="ground"></div><div class="mist"></div><div id="particles"></div><div id="chapterTag"></div><div id="chest" class="chest">🎁</div><div id="fighters"><div id="hero" class="fighter heroPos"><div id="heroSprite" class="sprite">⚔️</div><div class="name" id="heroName"></div><div class="bar"><i id="heroHP"></i></div><div class="tiny" id="heroHPText"></div><div id="heroDmg" class="damage"></div><div id="heroSlash" class="slash">✦</div></div><div id="enemy" class="fighter enemyPos enemy"><div id="enemySprite" class="sprite">👹</div><div class="name" id="enemyName"></div><div class="bar enemyBar"><i id="enemyHP"></i></div><div class="tiny" id="enemyHPText"></div><div id="enemyDmg" class="damage"></div></div></div></div><div id="hud"><div class="hudBox"><b id="hudHero"></b><div>⚡ Pouvoir <b id="hudPower"></b>/11</div><div class="bar"><i id="hudHP"></i></div></div><div class="hudBox" style="text-align:right">💰 <b id="hudGold"></b><br><span id="hudEnemy"></span></div></div><div id="controls"><button class="ctrl attack" onclick="normalAttack()">⚔️ ATTAQUER</button><button id="p1Btn" class="ctrl p1" onclick="usePower(1)">⚡ POUVOIR 1<span class="cool" id="p1Cd"></span></button><button id="p7Btn" class="ctrl p7" onclick="usePower(7)">⚡ ÉVEIL 7<span class="cool" id="p7Cd"></span></button><button id="p9Btn" class="ctrl p9" onclick="usePower(9)">🔥 FRAPPE 9<span class="cool" id="p9Cd"></span></button><button id="p11Btn" class="ctrl p11" onclick="usePower(11)">👑 SUPRÊME 11<span class="cool" id="p11Cd"></span></button><button class="ctrl heal" onclick="healAttack()">💚 SOIN<span class="cool" id="healCd"></span></button></div><div id="toast"></div><div id="cutscene"><div class="cs"><div class="csIcon" id="csIcon">🌑</div><h2 id="csTitle"></h2><p id="csText"></p><div class="cinBar"><i id="cinProgress"></i></div><br><button class="gold" onclick="advanceCutscene()">CONTINUER</button></div></div></section>
<section id="result" class="screen"><div class="resultIcon" id="resultIcon">🏆</div><div id="resultTitle" class="resultTitle victory">VICTOIRE</div><div id="resultText"></div><div class="scoreline" id="resultScore"></div><div class="row" style="justify-content:center;margin-top:12px"><button class="gold" onclick="resultContinue()">CONTINUER</button><button onclick="show('menu')">MENU</button></div></section>
<div id="modal" class="modal"><div class="modalPanel"><div class="row" style="justify-content:space-between"><h2 id="modalTitle" style="margin:0"></h2><button onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const chars={
 kaien:{name:'Kaien',icon:'⚔️',baseHP:120,baseAtk:12,hpStep:8,atkStep:2,desc:'Équilibré',power:'Lame spectrale'},
 aiko:{name:'Aiko',icon:'🗡️',baseHP:90,baseAtk:16,hpStep:7,atkStep:2.3,desc:'Rapide et puissante',power:'Danse des ombres'},
 ren:{name:'Ren',icon:'🛡️',baseHP:160,baseAtk:9,hpStep:11,atkStep:1.7,desc:'Très résistant',power:'Mur du gardien'},
 mia:{name:'Mia',icon:'🔥',baseHP:105,baseAtk:14,hpStep:8,atkStep:2.1,desc:'Énergie offensive',power:'Flamme astrale'}
};
const chapters=[
 {name:'Chapitre I — Les Ombres',introIcon:'🌑',intro:'Une ancienne force se réveille dans les ruines. Ton premier objectif : traverser le sanctuaire et vaincre son gardien.',enemies:[['Éclaireur de l’ombre','👤',75,8],['Guerrier noir','🗿',105,10],['Chasseur spectral','👺',120,12]],boss:['Gardien du Sanctuaire','👹',260,17]},
 {name:'Chapitre II — La Cité Brisée',introIcon:'🏯',intro:'La cité est sous le contrôle d’une armée inconnue. Les ennemis sont plus rapides et le boss protège la porte du royaume.',enemies:[['Assassin nocturne','🥷',150,14],['Samouraï corrompu','⚔️',175,16],['Mage de l’ombre','🧙',145,18]],boss:['Seigneur de la Cité','👺',360,23]},
 {name:'Chapitre III — Le Royaume du Néant',introIcon:'🌌',intro:'Tu atteins le cœur du Néant. Chaque victoire te rapproche du dernier adversaire et de la vérité sur Shadow Legacy.',enemies:[['Démon du Néant','👿',220,20],['Chevalier spectral','💀',250,22],['Titan obscur','🦹',290,25]],boss:['Roi du Néant','👑',520,31]}
];
let save=loadSave();
let state={chapter:0,enemyIndex:0,enemy:null,selected:'kaien',storyStep:0,cutsceneStep:0,mode:'intro',busy:false,finished:false,lastFrame:0,cd:{1:0,7:0,9:0,11:0,heal:0},enemyTimer:null,score:0};
function defaultSave(){return {gold:350,powerLevel:1,selected:'kaien',skin:'default',skins:{default:true},specialPowers:{7:false,9:false,11:false},wins:0,defeats:0,bestScore:0,settings:{music:true,sfx:true,vibration:true},friends:['Ami_ombre'],history:[]}}
function loadSave(){try{
  const raw=localStorage.getItem('shadowLegacyV8')||localStorage.getItem('shadowLegacyV7');
  const x=raw?JSON.parse(raw):{};
  const d=defaultSave();
  return Object.assign(d,x,{
    settings:Object.assign(d.settings,x.settings||{}),
    skins:Object.assign({default:true},x.skins||{}),
    specialPowers:Object.assign({7:false,9:false,11:false},x.specialPowers||{})
  });
}catch(e){return defaultSave()}}
function persist(){localStorage.setItem('shadowLegacyV8',JSON.stringify(save));localStorage.setItem('shadowLegacyV7',JSON.stringify(save));updateMenu()}
function stats(key=save.selected){const c=chars[key];const p=save.powerLevel;return {maxHP:Math.round(c.baseHP+(p-1)*c.hpStep),atk:Math.round((c.baseAtk+(p-1)*c.atkStep)*10)/10}}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');if(id==='menu')updateMenu()}
function updateMenu(){const s=stats();$('menuStats').innerHTML=`${chars[save.selected].icon} ${chars[save.selected].name} • ⚡ Pouvoir <b>${save.powerLevel}/11</b> • ❤️ ${s.maxHP} PV • ⚔️ ${s.atk} dégâts • 💰 ${save.gold}`}
function renderChars(){const wrap=$('chars');wrap.innerHTML='';Object.entries(chars).forEach(([id,c])=>{const st=stats(id);const d=document.createElement('div');d.className='card char'+(state.selected===id?' selected':'');d.onclick=()=>{state.selected=id;renderChars()};d.innerHTML=`<div class="charArt">${c.icon}</div><h3 style="margin:5px 0">${c.name}</h3><span class="tag">${c.desc}</span><div class="stats"><b>❤️ ${st.maxHP} PV</b><br><b>⚔️ ${st.atk} dégâts</b><br>⚡ Pouvoir : ${c.power}</div>`;wrap.appendChild(d)})}
function startGame(){state.selected=save.selected;state.chapter=0;state.enemyIndex=0;state.score=0;state.finished=false;state.storyStep=0;state.cd={1:0,7:0,9:0,11:0,heal:0};showStory()}
function showStory(){const ch=chapters[state.chapter];$('storyArt').textContent=ch.introIcon;$('storyTitle').textContent=ch.name;$('storyText').textContent=ch.intro;show('story')}
function nextStory(){show('select');renderChars()}
function confirmCharacter(){save.selected=state.selected;persist();startChapterIntro()}
function startChapterIntro(){state.enemyIndex=0;state.mode='intro';state.cutsceneStep=0;show('gameplay');showCutscene(chapters[state.chapter].name,chapters[state.chapter].intro,chapters[state.chapter].introIcon)}
function showCutscene(title,text,icon){$('csTitle').textContent=title;$('csText').textContent=text;$('csIcon').textContent=icon;$('cinProgress').style.width='0%';$('cutscene').classList.add('show');state.mode='cutscene';let t=0;clearInterval(state.cinTimer);state.cinTimer=setInterval(()=>{t+=5;$('cinProgress').style.width=t+'%';if(t>=100)clearInterval(state.cinTimer)},100)}
function advanceCutscene(){ $('cutscene').classList.remove('show'); clearInterval(state.cinTimer); if(state.mode==='cutscene'){startEnemy()} }
function makeEnemy(){const ch=chapters[state.chapter];const isBoss=state.enemyIndex>=ch.enemies.length;const e=isBoss?ch.boss:ch.enemies[state.enemyIndex];const scale=1+(save.powerLevel-1)*.05;return {name:e[0],icon:e[1],maxHP:Math.round(e[2]*scale),hp:Math.round(e[2]*scale),atk:Math.round(e[3]*scale),boss:isBoss}}
function startEnemy(){state.enemy=makeEnemy();state.busy=false;$('enemy').classList.remove('dead');$('enemySprite').textContent=state.enemy.icon;$('enemyName').innerHTML=state.enemy.name+(state.enemy.boss?' <span class="bossTitle">• BOSS</span>':'');$('chapterTag').textContent=chapters[state.chapter].name+' • '+(state.enemy.boss?'BOSS':`Ennemi ${state.enemyIndex+1}/${chapters[state.chapter].enemies.length}`);$('chest').classList.remove('show');renderBattle();clearInterval(state.enemyTimer);state.enemyTimer=setInterval(enemyAutoAttack,3200);showToast(state.enemy.boss?'Le boss entre dans l’arène !':'Un ennemi approche !')}
function renderBattle(){const s=stats();$('heroSprite').textContent=chars[save.selected].icon;$('heroName').textContent=chars[save.selected].name;$('heroHP').style.width=clamp((game.hp/s.maxHP)*100,0,100)+'%';$('hudHP').style.width=clamp((game.hp/s.maxHP)*100,0,100)+'%';$('heroHPText').textContent=`${Math.max(0,Math.ceil(game.hp))}/${s.maxHP} PV`;$('enemyHP').style.width=clamp((state.enemy.hp/state.enemy.maxHP)*100,0,100)+'%';$('enemyHPText').textContent=`${Math.max(0,Math.ceil(state.enemy.hp))}/${state.enemy.maxHP} PV`;$('hudHero').textContent=chars[save.selected].name;$('hudPower').textContent=save.powerLevel;$('hudGold').textContent=save.gold;$('hudEnemy').textContent=state.enemy.name;updatePowerButtons()}
let game={hp:0};
function resetPlayerHP(full=true){const s=stats();if(full||!game.hp)game.hp=s.maxHP;else game.hp=clamp(game.hp+s.maxHP*.25,0,s.maxHP)}
function beginBattle(){resetPlayerHP(true);startEnemy()}
function normalAttack(){if(!state.enemy||state.busy||state.enemy.hp<=0)return;const s=stats();let dmg=s.atk*(.92+Math.random()*.16);hitEnemy(dmg,'⚔️');playSfx('attack')}
function usePower(level){
  if(!state.enemy||state.busy||state.enemy.hp<=0)return;
  if(save.powerLevel<level){showToast(`Il faut le niveau de pouvoir ${level}/11.`);return}
  if([7,9,11].includes(level)&&!save.specialPowers[level]){
    showToast(`Achète le pouvoir ${level} dans la boutique.`);
    return;
  }const now=Date.now();if(now<state.cd[level]){showToast(`Pouvoir ${level} : encore ${Math.ceil((state.cd[level]-now)/1000)} s`);return}const s=stats();let dmg=s.atk,heal=0,kind='power';if(level===1){dmg*=1.8;state.cd[1]=now+4000;kind='power1'}if(level===7){dmg*=2.7;state.cd[7]=now+8000;kind='power7'}if(level===9){dmg*=4.2;state.cd[9]=now+12000;kind='power9'}if(level===11){dmg*=6.5;state.cd[11]=now+20000;kind='power11'}if(level===7){game.hp=clamp(game.hp+s.maxHP*.12,0,s.maxHP)}if(level===11){game.hp=clamp(game.hp+s.maxHP*.2,0,s.maxHP)}hitEnemy(dmg,kind);playSfx('power');updateBattleLoop()}
function healAttack(){if(!state.enemy||state.busy||state.enemy.hp<=0)return;const now=Date.now();if(now<state.cd.heal){showToast(`Soin : encore ${Math.ceil((state.cd.heal-now)/1000)} s`);return}state.cd.heal=now+7000;const s=stats();const amount=Math.round(s.maxHP*.22);game.hp=clamp(game.hp+amount,0,s.maxHP);showDamage('heroDmg','+'+amount,'heal');showToast('💚 PV régénérés');playSfx('heal');updateBattleLoop()}
function hitEnemy(dmg,kind){state.busy=true;dmg=Math.max(1,Math.round(dmg));state.enemy.hp=clamp(state.enemy.hp-dmg,0,state.enemy.maxHP);showDamage('enemyDmg','-'+dmg,kind);$('enemy').classList.add('hit');$('heroSlash').classList.add('show');setTimeout(()=>{$('enemy').classList.remove('hit');$('heroSlash').classList.remove('show')},300);setTimeout(()=>{state.busy=false;if(state.enemy.hp<=0)winEnemy();},180);updateBattleLoop()}
function showDamage(id,text,type){const el=$(id);el.textContent=text;el.style.color=type==='heal'?'#75e19a':'#fff';el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}
function enemyAutoAttack(){if(state.busy||!state.enemy||state.enemy.hp<=0)return;const dmg=Math.round(state.enemy.atk*(.88+Math.random()*.2));game.hp=clamp(game.hp-dmg,0,stats().maxHP);showDamage('heroDmg','-'+dmg,'enemy');$('hero').classList.add('hit');setTimeout(()=>$('hero').classList.remove('hit'),250);playSfx('hit');updateBattleLoop();if(game.hp<=0)loseGame()}
function updateBattleLoop(){renderBattle();updateCooldowns()}
function updateCooldowns(){
  const now=Date.now();
  for(const n of [1,7,9,11]){
    const lockedLevel=save.powerLevel<n;
    const lockedPurchase=[7,9,11].includes(n)&&!save.specialPowers[n];
    if(lockedLevel)$('p'+n+'Cd').textContent='🔒 niveau '+n;
    else if(lockedPurchase)$('p'+n+'Cd').textContent='🛒 boutique';
    else $('p'+n+'Cd').textContent=state.cd[n]>now?`${Math.ceil((state.cd[n]-now)/1000)} s`:'PRÊT';
    $('p'+n+'Btn').disabled=lockedLevel||lockedPurchase||state.cd[n]>now;
  }
  $('healCd').textContent=state.cd.heal>now?`${Math.ceil((state.cd.heal-now)/1000)} s`:'PRÊT';
  $('p1Btn').disabled=save.powerLevel<1||state.cd[1]>now;
  $('p7Btn').disabled=save.powerLevel<7||!save.specialPowers[7]||state.cd[7]>now;
  $('p9Btn').disabled=save.powerLevel<9||!save.specialPowers[9]||state.cd[9]>now;
  $('p11Btn').disabled=save.powerLevel<11||!save.specialPowers[11]||state.cd[11]>now;
}
function updatePowerButtons(){updateCooldowns()}
function winEnemy(){clearInterval(state.enemyTimer);state.enemy.hp=0;renderBattle();$('enemy').classList.add('dead');const ch=chapters[state.chapter];const s=state.enemy.boss?300:80;state.score+=s;save.gold+=state.enemy.boss?180:45;save.history.unshift(`${state.enemy.name} vaincu`);save.history=save.history.slice(0,10);persist();if(!state.enemy.boss){resetPlayerHP(false);setTimeout(()=>{openChest();},700)}else{save.wins++;save.bestScore=Math.max(save.bestScore,state.score);persist();setTimeout(()=>bossVictory(),850)}}
function openChest(){state.busy=false;$('chest').classList.add('show');showToast('🎁 Un coffre apparaît ! Appuie sur lui');$('chest').onclick=()=>{if(!$('chest').classList.contains('show'))return;$('chest').classList.remove('show');const roll=Math.random();if(roll<.45){const g=90+Math.floor(Math.random()*101);save.gold+=g;showToast(`💰 Coffre : +${g} pièces`)}else if(roll<.75){const before=game.hp;game.hp=clamp(game.hp+Math.round(stats().maxHP*.35),0,stats().maxHP);showToast(`💚 Coffre : +${Math.round(game.hp-before)} PV`)}else{save.gold+=200;showToast('💰 Coffre : +200 pièces');}persist();setTimeout(nextEnemy,900)} }
function nextEnemy(){state.enemyIndex++;startEnemy()}
function bossVictory(){showCutscene(chapters[state.chapter].name+' — Victoire','Le boss est vaincu. Le royaume révèle une nouvelle partie de son secret. Tes PV sont régénérés avant le prochain chapitre.', '✨');state.mode='bossVictory';const oldAdvance=advanceCutscene;window._afterCutscene='chapter';}
function loseGame(){if(state.finished)return;state.finished=true;clearInterval(state.enemyTimer);save.defeats++;persist();show('result');$('resultIcon').textContent='🌑';$('resultTitle').textContent='DÉFAITE';$('resultTitle').className='resultTitle defeat';$('resultText').textContent='Ton aventure s’arrête ici pour cette fois. Tes améliorations sont conservées.';$('resultScore').textContent=`Score : ${state.score}`}
function resultContinue(){state.finished=false;state.busy=false;clearInterval(state.enemyTimer);state.enemyIndex=0;show('menu')}
const specialPowerData={
  7:{name:'Éveil des ombres',icon:'⚡',cost:400,desc:'Renforce l’Éveil 7 et ajoute une régénération pendant son attaque.'},
  9:{name:'Frappe abyssale',icon:'🔥',cost:700,desc:'Débloque la Frappe 9 avec des dégâts renforcés.'},
  11:{name:'Suprême du Néant',icon:'👑',cost:1000,desc:'Débloque le pouvoir ultime du niveau 11.'}
};
function openShop(){
  const s=stats();
  const powerCost=save.powerLevel>=11?0:120+(save.powerLevel-1)*90;
  const skins=[
    ['default','🌑','Ombre classique',0],
    ['crimson','🔴','Ombre écarlate',300],
    ['azure','🔵','Ombre azur',500],
    ['gold','🟡','Ombre royale',800],
    ['void','🟣','Ombre du Néant',1200]
  ];

  const specialHtml=Object.entries(specialPowerData).map(([level,x])=>{
    const n=Number(level);
    const unlocked=save.powerLevel>=n;
    const owned=!!save.specialPowers[n];
    let action='';
    if(owned) action='<button class="green" disabled>ACHETÉ</button>';
    else if(!unlocked) action=`<button disabled>🔒 NIVEAU ${n}</button>`;
    else action=`<button class="gold" onclick="buySpecialPower(${n})">💰 ${x.cost}<br>ACHETER</button>`;
    return `<div class="shopItem specialPower">
      <div class="spInfo"><b>${x.icon} ${x.name}</b><br><span class="tiny">Niveau ${n} • ${x.desc}</span></div>
      <div>${action}</div>
    </div>`;
  }).join('');

  const skinHtml=skins.map(x=>{
    const owned=!!save.skins[x[0]];
    const equipped=owned&&save.skin===x[0];
    const button=owned
      ? `<button class="${equipped?'gold':'purple'}" ${equipped?'disabled':''} onclick="${equipped?'':'equipSkin(\\''+x[0]+'\\')'}">${equipped?'ÉQUIPÉ':'ÉQUIPER'}</button>`
      : `<button class="purple" onclick="buySkin('${x[0]}',${x[3]})">💰 ${x[3]} • ACHETER</button>`;
    return `<div class="card skin ${owned?'':'locked'}">
      <div class="skinIcon">${x[1]}</div>
      <div class="skinInfo"><b>${x[2]}</b><br>${owned?'<span class="onlineBadge">Possédé</span>':`<span class="price">💰 ${x[3]}</span>`}</div>
      ${button}
    </div>`;
  }).join('');

  const html=`<div class="shopCoins">💰 <b>${save.gold}</b> pièces disponibles</div>
    <div class="notice">⚡ Niveau de pouvoir <b>${save.powerLevel}/11</b><br>❤️ ${s.maxHP} PV • ⚔️ ${s.atk} dégâts<br><span class="muted">Le niveau de pouvoir améliore automatiquement les PV et les dégâts du personnage.</span></div>
    <div class="shopItem"><div><b>⚡ Améliorer le pouvoir</b><br><span class="muted">Améliore le niveau de pouvoir avec les pièces gagnées. Maximum 11.</span></div>
      <div>${save.powerLevel>=11?'<b>MAX</b>':`<span class="price">💰 ${powerCost}</span> <button class="gold" onclick="buyPower()">AMÉLIORER</button>`}</div>
    </div>
    <h3>✨ Pouvoirs spéciaux</h3>
    <div class="notice">À partir des niveaux 7, 9 et 11, le niveau seul ne suffit plus : il faut acheter chaque pouvoir spécial dans la boutique.</div>
    ${specialHtml}
    <div class="shopItem"><div><b>💚 Potion</b><br><span class="muted">Utilisable après un combat.</span></div>
      <div><span class="price">💰 50</span> <button onclick="buyPotion()">ACHETER</button></div>
    </div>
    <h3>🎨 Skins</h3>
    <div class="skinGrid">${skinHtml}</div>`;

  openModal('🛒 Boutique',html);
}
function buySpecialPower(level){
  const x=specialPowerData[level];
  if(!x||save.powerLevel<level)return;
  if(save.specialPowers[level]){showToast('Pouvoir déjà acheté.');return}
  if(save.gold<x.cost){showToast('Pas assez de pièces.');return}
  save.gold-=x.cost;
  save.specialPowers[level]=true;
  persist();
  openShop();
  showToast(`${x.icon} ${x.name} débloqué !`);
}
function equipSkin(id){
  if(!save.skins[id])return;
  save.skin=id;
  persist();
  openShop();
}
function buyPotion(){if(save.gold<50){showToast('Pas assez de pièces.');return}save.gold-=50;persist();showToast('💚 Potion achetée !')}
function buySkin(id,cost){if(save.gold<cost){showToast('Pas assez de pièces.');return}save.gold-=cost;save.skins[id]=true;save.skin=id;persist();openShop()}
function openScores(){const rows=[['1','ShadowMaster','98 420'],['2','Kaien_77','82 100'],['3','AikoMoon','75 630'],['4','RenGuard','69 440'],['5','MiaFire','61 200']];openModal('🏆 Classement',`<div class="notice"><span class="offlineBadge">MODE LOCAL</span> Ce classement est préparé pour être relié à un serveur. GitHub Pages seul ne peut pas stocker un classement mondial partagé entre tous les joueurs.</div><table class="miniTable"><tr><th>#</th><th>Joueur</th><th>Score</th></tr>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</table><p class="muted">Ton meilleur score local : <b>${save.bestScore}</b></p>`)}
function openSocial(){openModal('👥 Amis & duel',`<div class="notice">👤 Amis</div><div class="grid">${save.friends.map(f=>`<div class="card"><b>🟢 ${f}</b><br><span class="muted">Ami</span><br><button onclick="showToast('Invitation envoyée à ${f}')">Inviter en duel</button></div>`).join('')}</div><div class="notice">⚔️ <b>Duels joueurs</b><br><span class="muted">L'interface est prête, mais un vrai duel entre deux iPhone nécessite un serveur temps réel. Cette version GitHub Pages garde le jeu solo fonctionnel sans faux multijoueur.</span></div><button onclick="showToast('Mode duel en attente du serveur')">Créer une partie</button>`)}
function openSettings(){openModal('⚙ Réglages',`<div class="shopItem"><div>🎵 Musique</div><button onclick="toggleSetting('music')">${save.settings.music?'ON':'OFF'}</button></div><div class="shopItem"><div>🔊 Sons</div><button onclick="toggleSetting('sfx')">${save.settings.sfx?'ON':'OFF'}</button></div><div class="shopItem"><div>📳 Vibration</div><button onclick="toggleSetting('vibration')">${save.settings.vibration?'ON':'OFF'}</button></div><div class="shopItem"><div>💾 Sauvegarde</div><button class="red" onclick="resetSave()">RÉINITIALISER</button></div>`)}
function toggleSetting(k){save.settings[k]=!save.settings[k];persist();openSettings();if(k==='music')toggleMusic();else if(k==='sfx')resumeAudio()}
function resetSave(){if(!confirm('Réinitialiser toute la progression ?'))return;save=defaultSave();persist();closeModal();showToast('Progression réinitialisée')}
function openModal(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modal').classList.add('open')}
function closeModal(){$('modal').classList.remove('open')}
function showToast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.remove('show'),1800)}
let audio=null,master=null,musicGain=null,musicTimer=null,musicStep=0;
function audioInit(){
  if(audio)return;
  try{
    audio=new (window.AudioContext||window.webkitAudioContext)();
    master=audio.createGain(); master.gain.value=.14; master.connect(audio.destination);
    musicGain=audio.createGain(); musicGain.gain.value=.16; musicGain.connect(master);
  }catch(e){audio=null;}
}
function resumeAudio(){audioInit();if(audio&&audio.state==='suspended')audio.resume();if(save.settings.music)startMusic();}
function tone(freq,dur,type='sine',gain=.18,out=master){
  if(!audio||!out)return;
  try{
    const o=audio.createOscillator(),g=audio.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);
    g.gain.setValueAtTime(.001,audio.currentTime);
    g.gain.exponentialRampToValueAtTime(Math.max(.01,gain),audio.currentTime+.012);
    g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);
    o.connect(g);g.connect(out);o.start();o.stop(audio.currentTime+dur+.03);
  }catch(e){}
}
function playSfx(k){
  if(!save.settings.sfx)return;
  audioInit();
  if(k==='attack'){tone(150,.10,'sawtooth',.30);setTimeout(()=>tone(300,.08,'triangle',.22),45)}
  else if(k==='power'){tone(85,.16,'square',.30);setTimeout(()=>tone(360,.22,'triangle',.28),70)}
  else if(k==='hit'){tone(70,.09,'square',.24)}
  else if(k==='heal'){tone(440,.14,'sine',.22);setTimeout(()=>tone(660,.16,'sine',.22),90)}
}
const melody=[261.63,329.63,392.00,329.63,293.66,349.23,440.00,349.23,261.63,329.63,392.00,523.25,440.00,392.00,329.63,293.66];
function musicTick(){
  if(!audio||!save.settings.music)return;
  const f=melody[musicStep%melody.length];
  tone(f,.30,'triangle',.09,musicGain);
  if(musicStep%4===0) tone(f/2,.42,'sine',.045,musicGain);
  musicStep++;
}
function startMusic(){
  audioInit();
  if(!save.settings.music||musicTimer)return;
  musicTick();
  musicTimer=setInterval(musicTick,420);
}
function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null;} }
function toggleMusic(){if(save.settings.music){resumeAudio()}else stopMusic()}
document.addEventListener('pointerdown',resumeAudio,{once:true,passive:true});
function spawnParticles(){const p=$('particles');for(let i=0;i<28;i++){const d=document.createElement('i');d.className='particle';d.style.left=Math.random()*100+'%';d.style.animationDuration=(6+Math.random()*9)+'s';d.style.animationDelay=(-Math.random()*12)+'s';d.style.opacity=(.2+Math.random()*.6);p.appendChild(d)}}
function gameLoop(){updateCooldowns();requestAnimationFrame(gameLoop)}
// Cutscene continuation override for chapter transitions
const originalAdvance=advanceCutscene;
advanceCutscene=function(){ $('cutscene').classList.remove('show');clearInterval(state.cinTimer);if(state.mode==='bossVictory'){state.chapter++;if(state.chapter>=chapters.length){finalVictory();return}resetPlayerHP(true);state.enemyIndex=0;startChapterIntro();return}if(state.mode==='cutscene'){beginBattle();return}}
function finalVictory(){clearInterval(state.enemyTimer);state.finished=true;save.bestScore=Math.max(save.bestScore,state.score+1000);save.gold+=500;persist();show('result');$('resultIcon').textContent='👑';$('resultTitle').textContent='VICTOIRE FINALE';$('resultTitle').className='resultTitle victory';$('resultText').textContent='Le Roi du Néant est vaincu. Une dernière cinématique marque la fin de cette aventure.';$('resultScore').textContent=`Score final : ${state.score+1000} • +500 💰`;setTimeout(()=>showFinalCutscene(),450)}
function showFinalCutscene(){show('gameplay');showCutscene('FIN — SHADOW LEGACY','Le royaume retrouve son équilibre. Les héros regardent l’horizon tandis que le dernier fragment de l’ombre disparaît. L’aventure est terminée… pour l’instant.','🌅');state.mode='final';const old=$('cutscene').querySelector('button');old.onclick=()=>{ $('cutscene').classList.remove('show');show('menu'); }}
window.addEventListener('load',()=>{spawnParticles();updateMenu();setTimeout(()=>show('menu'),2400);gameLoop()});
</script>
